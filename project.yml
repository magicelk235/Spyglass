name: Spyglass
options:
  bundleIdPrefix: com.spyglass
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

settings:
  base:
    MARKETING_VERSION: "2.0.0"
    # Sparkle compares CFBundleVersion, so it must grow every release.
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "V8K8L3ZSD5"
    ENABLE_HARDENED_RUNTIME: YES
    # System bzip2 has no Swift module in the SDK; this module map exposes it.
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/SpyglassKit/CBzip2

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.5"

targetTemplates:
  # The web previews' shell and vendored JS, copied to Resources/Web with
  # their folder layout intact (KaTeX's CSS finds its fonts by relative path).
  # WebRenderer loads them from there in the extension and in the harness.
  WebPreviewResources:
    sources:
      - path: Preview/Web/shell.html
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Web
      - path: Preview/Web/app.js
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Web
      - path: Preview/Web/app.css
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Web
      - path: Preview/Web/vendor
        type: folder
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Web

targets:
  # Shared, unit-testable logic used by both the app and the extension.
  SpyglassKit:
    type: library.static
    platform: macOS
    sources: [SpyglassKit/Sources]
    settings:
      base:
        DEFINES_MODULE: YES

  # Host application: menu-bar menu, settings, license, Google sign-in, updates.
  Spyglass:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: GoogleOAuth.plist
        buildPhase: resources
      - path: AppIcon.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyglass.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    dependencies:
      - target: SpyglassKit
      - target: SpyglassPreview
        embed: true
      - target: SpyglassThumbnail
        embed: true
      - package: Sparkle

  # Quick Look Preview Extension (.appex embedded in the app).
  SpyglassPreview:
    type: app-extension
    platform: macOS
    templates: [WebPreviewResources]
    sources:
      - path: Preview
        excludes:
          - Web/shell.html
          - Web/app.js
          - Web/app.css
          - Web/vendor
      - path: GoogleOAuth.plist
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyglass.app.preview
        INFOPLIST_FILE: Preview/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Preview/Preview.entitlements
    dependencies:
      - target: SpyglassKit

  # Finder thumbnails for Google stubs, drawn from the cached Drive PDF.
  SpyglassThumbnail:
    type: app-extension
    platform: macOS
    sources: [Thumbnail]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyglass.app.thumbnail
        INFOPLIST_FILE: Thumbnail/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Thumbnail/Thumbnail.entitlements
    dependencies:
      - target: SpyglassKit

  # Dev tool: renders files through FormatPreview and writes PNGs, so
  # renderers can be checked visually without installing the extension.
  # Compiles the extension's rendering sources; never shipped.
  PreviewHarness:
    type: application
    platform: macOS
    templates: [WebPreviewResources]
    sources:
      - path: Tools/PreviewHarness
      - path: Preview/Rendering
      - path: Preview/Renderers
        optional: true
      - path: Preview/Web/WebRenderer.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyglass.preview-harness
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: SpyglassKit

  # Unit tests for the pure logic in SpyglassKit.
  SpyglassKitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Tests need no entitlements; ad-hoc keeps them runnable without a cert.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: SpyglassKit

schemes:
  Spyglass:
    build:
      targets:
        Spyglass: all
    run:
      config: Debug
  SpyglassKit:
    build:
      targets:
        SpyglassKit: all
        SpyglassKitTests: [test]
    test:
      targets:
        - SpyglassKitTests
  PreviewHarness:
    build:
      targets:
        PreviewHarness: all
